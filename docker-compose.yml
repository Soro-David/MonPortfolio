services:

  # ─── PHP-FPM (Laravel) ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: monportfolio-app
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./laravel/.env
    networks:
      - monportfolio
    restart: unless-stopped

  # ─── Nginx (reverse proxy) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: monportfolio-nginx
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./laravel:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - monportfolio
    restart: unless-stopped

  # ─── MySQL ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: monportfolio-mysql
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - monportfolio
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  # ─── Vite (HMR dev server) ────────────────────────────────────
  vite:
    image: node:20-alpine
    container_name: monportfolio-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./laravel:/var/www/html
    environment:
      - VITE_APP_NAME=MonPortfolio
      - NODE_OPTIONS=--dns-result-order=ipv4first
    networks:
      - monportfolio
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  monportfolio:
    driver: bridge
