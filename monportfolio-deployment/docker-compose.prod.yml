version: '3.8'

services:
  monportfolio:
    image: monportfolio:latest
    build:
      context: ./MonPortfolio
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./MonPortfolio:/app
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - API_KEY=${API_KEY}
    networks:
      - monportfolio-network

networks:
  monportfolio-network:
    driver: bridge

volumes:
  monportfolio-data: