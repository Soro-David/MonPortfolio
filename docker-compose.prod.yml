services:

  # ─── PHP-FPM (Laravel) ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: monportfolio-app-prod
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ./laravel/.env
    networks:
      - monportfolio-prod
    restart: always

  # ─── Nginx (reverse proxy) ────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: monportfolio-nginx-prod
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www/html
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - monportfolio-prod
    restart: always

  # ─── MySQL ────────────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: monportfolio-mysql-prod
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Secret123} 
      MYSQL_USER: root
      MYSQL_PASSWORD: ${DB_USER_PASSWORD:-Secret123}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - monportfolio-prod
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-Secret123}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # NB: Pas de service "vite" en production. 
  # Les assets doivent être buildés (npm run build).

volumes:
  mysql_data_prod:

networks:
  monportfolio-prod:
    driver: bridge
