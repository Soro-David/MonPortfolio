server {
    listen 80;
    server_name 108.181.201.77; # Remplace par ton nom de domaine ou IP VPS si nécessaire

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Fichiers statiques et requêtes de l'application
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Interprétation PHP via php-fpm (conteneur app)
    location ~ \.php$ {
        fastcgi_pass monportfolio-app-prod:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Mise en cache drastique pour les fichiers générés par Vite (dans public/build)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    # SÉCURITÉ: Bloquer l'accès aux fichiers sensibles (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
